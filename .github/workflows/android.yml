name: Custom Android build

on:
  push:
    branches: [codex/two-line-file-names]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Prepare F-Droid source variant
      run: |
        rg -l --null '//#ifdef NONFREE' app | xargs -0 sed -i '/\/\/#ifdef NONFREE/,/\/\/#endif/d'
        rm -r app/src/main/java/me/zhanghai/android/files/nonfree
    - name: Build release APK
      run: ./gradlew --no-daemon assembleRelease
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: material-files-unsigned
        path: app/build/outputs/apk/release/*.apk
        retention-days: 10
